<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italiano — 5 Language Vocabulary</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8f5;
    color: #24332b;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

header p {
    color: #6b7c72;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: auto;
}

/* Categories */

.categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.category {
    background: white;
    border: none;
    border-radius: 18px;
    padding: 22px 10px;
    cursor: pointer;
    font-size: 17px;
    transition: 0.2s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.category:hover {
    transform: translateY(-3px);
}

.category.active {
    background: #b9dfcc;
}

/* Main */

#main {
    display: none;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0 15px;
    gap: 10px;
}

.back {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
}

.mode-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.mode-buttons button {
    border: none;
    background: white;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.mode-buttons button.active {
    background: #315f4c;
    color: white;
}

/* Learn */

.card {
    background: white;
    border-radius: 25px;
    padding: 35px;
    margin: 20px 0;
    box-shadow: 0 6px 25px rgba(0,0,0,0.06);
    text-align: center;
}

.italian {
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 25px;
}

.translation {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.translation div {
    background: #f3f7f4;
    padding: 15px 8px;
    border-radius: 12px;
}

.translation span {
    display: block;
    font-size: 12px;
    color: #809087;
    margin-bottom: 5px;
}

/* Navigation */

.nav {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px;
}

.nav button,
.answer-btn,
.next-btn,
.restart-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    cursor: pointer;
    background: #315f4c;
    color: white;
    font-size: 15px;
}

.nav button {
    background: white;
    color: #315f4c;
}

/* Quiz */

.question {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin: 35px 0;
}

.question small {
    display: block;
    font-size: 14px;
    font-weight: normal;
    color: #7a8980;
    margin-bottom: 10px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.answer-btn {
    background: white;
    color: #24332b;
    border: 2px solid transparent;
}

.answer-btn:hover {
    border-color: #8fc5aa;
}

.answer-btn.correct {
    background: #b9dfcc;
    border-color: #4b9670;
}

.answer-btn.wrong {
    background: #f2caca;
    border-color: #c96c6c;
}

.result {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}

/* Progress */

.progress-box {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin: 20px 0;
}

.progress-bar {
    height: 10px;
    background: #e5ece8;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #5e9d7b;
}

/* Home */

.home-extra {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 40px;
}

.extra {
    background: white;
    padding: 25px;
    border-radius: 18px;
    cursor: pointer;
}

.extra h3 {
    margin-bottom: 7px;
}

/* Mobile */

@media(max-width: 650px) {
    header h1 {
        font-size: 30px;
    }

    .categories {
        grid-template-columns: repeat(2, 1fr);
    }

    .translation {
        grid-template-columns: repeat(2, 1fr);
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .card {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>ITALIANO 🇮🇹</h1>
    <p>Learn Italian through 5 languages</p>
</header>

<div class="container">

    <!-- HOME -->
    <div id="home">

        <div class="categories">

            <button class="category" onclick="openCategory('fruits')">
                🍎<br>Fruits
            </button>

            <button class="category" onclick="openCategory('animals')">
                🐾<br>Animals
            </button>

            <button class="category" onclick="openCategory('body')">
                🫀<br>Body Parts
            </button>

            <button class="category" onclick="openCategory('family')">
                👨‍👩‍👧<br>Family
            </button>

            <button class="category" onclick="openCategory('colors')">
                🎨<br>Colors
            </button>

            <button class="category" onclick="openCategory('professions')">
                👩‍💼<br>Professions
            </button>

        </div>

        <div class="home-extra">

            <div class="extra" onclick="showMistakes()">
                <h3>❌ Mistakes</h3>
                <p>Review words you got wrong.</p>
            </div>

            <div class="extra" onclick="showProgress()">
                <h3>📊 My Progress</h3>
                <p>See how much you've learned.</p>
            </div>

        </div>
    </div>


    <!-- MAIN -->
    <div id="main">

        <div class="topbar">

            <button class="back" onclick="goHome()">
                ← Categories
            </button>

            <h2 id="categoryTitle"></h2>

        </div>

        <div class="mode-buttons">

            <button onclick="setMode('learn')" id="learnBtn">
                📖 Learn
            </button>

            <button onclick="setMode('quiz')" id="quizBtn">
                🧠 Quiz
            </button>

            <button onclick="setMode('reverse')" id="reverseBtn">
                🔄 Reverse
            </button>

            <button onclick="setMode('mix')" id="mixBtn">
                🎲 Mix
            </button>

        </div>

        <div id="content"></div>

    </div>

</div>

/* =========================
   APP STATE
========================= */

let currentCategory = "";
let currentMode = "learn";
let currentIndex = 0;

let quizWords = [];
let questionNumber = 0;
let score = 0;

let mistakes = JSON.parse(localStorage.getItem("mistakes")) || [];


/* =========================
   OPEN CATEGORY
========================= */

function openCategory(category) {

    currentCategory = category;
    currentIndex = 0;

    document.getElementById("home").style.display = "none";
    document.getElementById("main").style.display = "block";

    const titles = {
        fruits:"🍎 Fruits",
        animals:"🐾 Animals",
        body:"🫀 Body Parts",
        family:"👨‍👩‍👧 Family",
        colors:"🎨 Colors",
        professions:"👩‍💼 Professions"
    };

    document.getElementById("categoryTitle").innerText = titles[category];

    setMode("learn");
}


/* =========================
   HOME
========================= */

function goHome() {

    document.getElementById("main").style.display = "none";
    document.getElementById("home").style.display = "block";

}


/* =========================
   MODE
========================= */

function setMode(mode) {

    currentMode = mode;

    document.querySelectorAll(".mode-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    if(mode === "learn")
        document.getElementById("learnBtn").classList.add("active");

    if(mode === "quiz")
        document.getElementById("quizBtn").classList.add("active");

    if(mode === "reverse")
        document.getElementById("reverseBtn").classList.add("active");

    if(mode === "mix")
        document.getElementById("mixBtn").classList.add("active");


    if(mode === "learn") showLearn();

    if(mode === "quiz") startQuiz(false);

    if(mode === "reverse") startQuiz(true);

    if(mode === "mix") startQuiz("mix");
}


/* =========================
   LEARN
========================= */

function showLearn() {

    const words = vocabulary[currentCategory];
    const word = words[currentIndex];

    document.getElementById("content").innerHTML = `

        <div class="card">

            <div class="italian">
                🇮🇹 ${word.it}
            </div>

            <div class="translation">

                <div>
                    <span>🇬🇧 English</span>
                    ${word.en}
                </div>

                <div>
                    <span>🇷🇺 Russian</span>
                    ${word.ru}
                </div>

                <div>
                    <span>🇰🇷 Korean</span>
                    ${word.ko}
                </div>

                <div>
                    <span>🇸🇦 Arabic</span>
                    ${word.ar}<br>
                    <small>${word.read}</small>
                </div>

            </div>

        </div>

        <div class="nav">

            <button onclick="previousWord()">← Previous</button>

            <span>
                ${currentIndex + 1} / ${words.length}
            </span>

            <button onclick="nextWord()">Next →</button>

        </div>

    `;
}


function nextWord() {

    const words = vocabulary[currentCategory];

    currentIndex++;

    if(currentIndex >= words.length)
        currentIndex = 0;

    showLearn();
}


function previousWord() {

    const words = vocabulary[currentCategory];

    currentIndex--;

    if(currentIndex < 0)
        currentIndex = words.length - 1;

    showLearn();
}


/* =========================
   QUIZ
========================= */

function startQuiz(reverseMode) {

    quizWords = [...vocabulary[currentCategory]];

    quizWords.sort(() => Math.random() - 0.5);

    questionNumber = 0;
    score = 0;

    showQuestion(reverseMode);
}


function showQuestion(reverseMode) {

    if(questionNumber >= quizWords.length) {

        showQuizResult();
        return;
    }

    const word = quizWords[questionNumber];

    let question;
    let correct;

    if(reverseMode === true) {

        const languages = ["en","ru","ko","ar"];

        const lang = languages[Math.floor(Math.random() * languages.length)];

        question = word[lang];
        correct = word.it;

    }

    else if(reverseMode === "mix") {

        const languages = ["en","ru","ko","ar"];

        const lang = languages[Math.floor(Math.random() * languages.length)];

        question = word[lang];
        correct = word.it;

    }

    else {

        question = word.it;

        const languages = ["en","ru","ko","ar"];

        const lang = languages[Math.floor(Math.random() * languages.length)];

        correct = word[lang];
    }


    let options = generateOptions(correct, word, reverseMode);

    document.getElementById("content").innerHTML = `

        <div class="card">

            <div class="question">

                <small>Question ${questionNumber + 1} / ${quizWords.length}</small>

                ${question}

            </div>

            <div class="answers">

                ${options.map((option, index) => `

                    <button
                        class="answer-btn"
                        onclick="checkAnswer(this, '${escapeText(option)}', '${escapeText(correct)}')">

                        ${option}

                    </button>

                `).join("")}

            </div>

            <div id="result" class="result"></div>

        </div>
    `;
}


/* =========================
   OPTIONS
========================= */

function generateOptions(correct, word, reverseMode) {

    let options = [correct];

    let pool = vocabulary[currentCategory];

    while(options.length < 4) {

        let randomWord = pool[Math.floor(Math.random() * pool.length)];

        let candidate;

        if(reverseMode === true || reverseMode === "mix") {

            candidate = randomWord.it;

        } else {

            const languages = ["en","ru","ko","ar"];

            const lang = languages[Math.floor(Math.random() * languages.length)];

            candidate = randomWord[lang];
        }

        if(!options.includes(candidate))
            options.push(candidate);
    }

    return options.sort(() => Math.random() - 0.5);
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(button, selected, correct) {

    const buttons = document.querySelectorAll(".answer-btn");

    buttons.forEach(btn => btn.disabled = true);

    if(selected === correct) {

        button.classList.add("correct");

        score++;

        document.getElementById("result").innerHTML =
            "✅ Correct!";

    } else {

        button.classList.add("wrong");

        buttons.forEach(btn => {

            if(btn.innerText.trim() === correct)
                btn.classList.add("correct");

        });

        document.getElementById("result").innerHTML =
            "❌ Correct answer: " + correct;

        saveMistake(quizWords[questionNumber]);
    }

    setTimeout(() => {

        questionNumber++;

        showQuestion(
            currentMode === "reverse"
                ? true
                : currentMode === "mix"
                    ? "mix"
                    : false
        );

    }, 900);
}


/* =========================
   MISTAKES
========================= */

function saveMistake(word) {

    if(!mistakes.some(x => x.it === word.it)) {

        mistakes.push(word);

        localStorage.setItem(
            "mistakes",
            JSON.stringify(mistakes)
        );
    }
}


function showMistakes() {

    document.getElementById("home").style.display = "none";
    document.getElementById("main").style.display = "block";

    document.getElementById("categoryTitle").innerText =
        "❌ Mistakes";

    document.querySelector(".mode-buttons").style.display = "none";

    if(mistakes.length === 0) {

        document.getElementById("content").innerHTML = `

            <div class="card">

                <h2>🎉 No mistakes!</h2>

                <p style="margin-top:15px">
                    You haven't made any mistakes yet.
                </p>

            </div>
        `;

        return;
    }

    document.getElementById("content").innerHTML = `

        <div class="card">

            ${mistakes.map(word => `

                <div style="
                    padding:15px;
                    margin:8px 0;
                    background:#f3f7f4;
                    border-radius:12px;
                    text-align:left;
                ">

                    <strong>🇮🇹 ${word.it}</strong><br>

                    🇬🇧 ${word.en} ·
                    🇷🇺 ${word.ru} ·
                    🇰🇷 ${word.ko} ·
                    🇸🇦 ${word.ar}

                </div>

            `).join("")}

            <br>

            <button
                class="restart-btn"
                onclick="clearMistakes()">

                Clear mistakes

            </button>

        </div>
    `;
}


function clearMistakes() {

    mistakes = [];

    localStorage.removeItem("mistakes");

    showMistakes();
}


/* =========================
   PROGRESS
========================= */

function showProgress() {

    document.getElementById("home").style.display = "none";
    document.getElementById("main").style.display = "block";

    document.getElementById("categoryTitle").innerText =
        "📊 My Progress";

    document.querySelector(".mode-buttons").style.display = "none";

    let total = 0;

    Object.values(vocabulary).forEach(category => {
        total += category.length;
    });

    let mistakeCount = mistakes.length;

    let learned = Math.max(0, total - mistakeCount);

    let percentage = Math.round((learned / total) * 100);

    document.getElementById("content").innerHTML = `

        <div class="progress-box">

            <h2>${percentage}%</h2>

            <p>${learned} / ${total} words</p>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percentage}%">
                </div>

            </div>

        </div>

        <div class="card">

            <h3>Keep going! 🌱</h3>

            <p style="margin-top:10px">
                Review your mistakes and test yourself again.
            </p>

        </div>
    `;
}


/* =========================
   QUIZ RESULT
========================= */

function showQuizResult() {

    const percentage =
        Math.round((score / quizWords.length) * 100);

    document.getElementById("content").innerHTML = `

        <div class="card">

            <h1>${score} / ${quizWords.length}</h1>

            <h2 style="margin-top:15px">
                ${percentage}%
            </h2>

            <p style="margin:20px 0">

                ${
                    percentage >= 90
                    ? "🔥 Excellent!"
                    : percentage >= 70
                    ? "👏 Good job!"
                    : "🌱 Keep practicing!"
                }

            </p>

            <button
                class="restart-btn"
                onclick="setMode('${currentMode}')">

                Try Again

            </button>

        </div>
    `;
}


/* =========================
   ESCAPE TEXT
========================= */

function escapeText(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
}


/* =========================
   FIX HOME MODES
========================= */

function goHome() {

    document.getElementById("main").style.display = "none";
    document.getElementById("home").style.display = "block";

    document.querySelector(".mode-buttons").style.display = "flex";
}


/* =========================
   START
========================= */

</script>
